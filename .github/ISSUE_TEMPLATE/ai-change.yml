name: AI 추천 기능 제안 (AI)
description: 진단 문항, 프롬프트, Gemini 연동 또는 추천 결과 화면의 변경을 제안합니다.
title: "[AI] "
labels: ["ai", "feat"]
body:
  - type: input
    id: target
    attributes:
      label: 대상 영역
      placeholder: 진단 문항, 가중치, 프롬프트, Gemini API, 결과 화면 등
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 필요성
      description: 현재 동작과 변경이 필요한 이유를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 입력(응답), 출력(추천 분야·학습 방향), 실패 시 처리와 확인 기준을 작성해 주세요.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 사전 확인
      options:
        - label: API 키를 코드나 이슈에 포함하지 않았습니다.
          required: true
        - label: 사용자 응답 저장 방식이 BE 설계와 맞는지 확인했습니다.
          required: true
