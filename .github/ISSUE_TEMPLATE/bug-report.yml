name: 버그 신고
description: 재현 가능한 오류나 예상과 다른 동작을 신고합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options:
        - FE (프론트엔드)
        - BE (백엔드 API·DB·인증)
        - AI (보안 분야 추천)
        - 공통 설정 또는 실행 환경
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 실제 동작과 오류 메시지를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 최소한의 절차(화면 경로, 계정 역할, 요청)를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 정상적으로 기대한 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, Node·Python 버전, Docker 사용 여부 등을 작성해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에 같은 문제가 없는지 확인했습니다.
          required: true
        - label: 로그와 예시에서 비밀 정보 및 개인정보를 제거했습니다.
          required: true
