name: API·DB 변경 제안 (BE)
description: API, DB 구조, 인증·권한 규칙의 추가·변경을 제안합니다.
title: "[BE] "
labels: ["be", "feat"]
assignees: ["Opal1031"]
body:
  - type: input
    id: target
    attributes:
      label: 대상 영역
      placeholder: API 경로, 테이블, 인증·권한, 예약, WebSocket 등
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 필요성
      description: 현재 동작과 변경이 필요한 이유를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 요청·응답과 권한
      description: 요청·응답 형식, 권한(임원진·팀장·팀원·미참여), 오류 코드와 검증 기준을 작성해 주세요.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 사전 확인
      options:
        - label: FE 화면에 미치는 영향을 확인했습니다.
          required: true
        - label: 비밀 정보와 개인정보를 포함하지 않았습니다.
          required: true
