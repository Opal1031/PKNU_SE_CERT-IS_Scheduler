# PR과 main 푸시마다 백엔드·프론트엔드를 검사한다.
# 배포(CD)는 서버가 정해지면(WBS 8.3) deploy 작업을 추가한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + test (SQLite, MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: certis_test
          MYSQL_USER: certis
          MYSQL_PASSWORD: certis
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucertis -pcertis"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test on SQLite
        run: pytest
      - name: Test on MySQL 8.0
        env:
          TEST_DATABASE_URL: mysql+pymysql://certis:certis@127.0.0.1:3306/certis_test?charset=utf8mb4
        run: pytest

  frontend:
    name: Frontend · typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 프론트엔드 코드가 아직 없는 브랜치(예: 백엔드 전용 PR)에서는 나머지 단계를 건너뛴다.
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

  docker:
    name: Docker · backend image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cert-is-api:${{ github.sha }} backend
