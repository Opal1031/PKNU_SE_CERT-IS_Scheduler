[project]
name = "cert-is-backend"
version = "0.1.0"
description = "CERT-IS 통합 관리 시스템 백엔드 (FastAPI)"
requires-python = ">=3.11"

# Vercel 배포: 빌드할 때 테이블 생성·샘플 입력(이미 있으면 건너뜀)을 먼저 실행한다.
[tool.vercel.scripts]
build = "python -m app.seed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
